services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${KANEO_ENV_FILE:-.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kaneo:
    image: ${KANEO_IMAGE:-ghcr.io/usekaneo/kaneo:latest}
    ports:
      - "5173:5173"
    env_file:
      - ${KANEO_ENV_FILE:-.env}
    # Uploads persist here when STORAGE_BACKEND=local and LOCAL_STORAGE_PATH is
    # set to /app/apps/api/data/uploads. S3 deployments leave both unset and the
    # volume stays unused.
    volumes:
      - uploads_data:/app/apps/api/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

#  Optional for HA Setup
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

volumes:
  postgres_data:
  uploads_data:
